[package]
name = "ipsa-gateway"
version = "1.0.38"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ipsadev/ipsa-gateway"
rust-version = "1.91.0"
description = "The keyless gRPC gateway for Stellar in ipsa: proofs, headers and unsigned transactions for IBC v2"
publish = false

[[bin]]
name = "ipsa-gateway"
path = "src/main.rs"

[dependencies]
ipsa = { version = "0.2", default-features = false, features = ["core", "gateway"] }
ipsa-chains = "0.1"

tonic = "0.14.6"
tonic-health = "0.14.1"
tonic-prost = "0.14.6"
tonic-reflection = "0.14.1"
prost = "0.14"

ibc = { version = "0.57.0", features = ["serde"] }

tokio = { version = "1.52.3", features = ["time", "rt-multi-thread", "macros", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.14", features = ["std"] }
webpki-roots = "1"

soroban-client = "0.7.0"
stellar-strkey = "0.0.16"
reqwest = { version = "0.12", features = ["json"] }

anyhow = "1"
thiserror = "1"
dotenvy = "0.15"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
axum = "0.8.9"
base64 = "0.22"
ibc-proto = { version = "0.51", default-features = false, features = ["std"] }
tendermint-proto = "0.40.3"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = 2 }

[lints.clippy]
use_self = "warn"

[profile.release]
lto = true
opt-level = 3
panic = "unwind"
overflow-checks = true
