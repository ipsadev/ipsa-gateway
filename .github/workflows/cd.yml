name: cd

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "extra image tag to push (e.g. a release version)"
        type: string
        required: false
        default: ""
      ref:
        description: "git ref to build; empty = the ref the run started from"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: gateway-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build & push by digest (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    environment: staging
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - name: prepare platform pair
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: resolve image name
        run: |
          image="$(printf '%s' "${{ vars.GATEWAY_IMAGE }}" | tr -d '[:space:]')"
          if [ -z "$image" ]; then
            echo "::error::GATEWAY_IMAGE is not set"
            exit 1
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: set up buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: log in to docker hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: build & push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=gateway-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=gateway-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-gateway-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest & push tags
    runs-on: ubuntu-latest
    environment: staging
    needs: build
    timeout-minutes: 15

    steps:
      - name: download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-gateway-*
          merge-multiple: true

      - name: resolve image name
        run: |
          image="$(printf '%s' "${{ vars.GATEWAY_IMAGE }}" | tr -d '[:space:]')"
          if [ -z "$image" ]; then
            echo "::error::GATEWAY_IMAGE is not set"
            exit 1
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: set up buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: log in to docker hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: create manifest list & push
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags="-t ${{ env.IMAGE }}:latest -t ${{ env.IMAGE }}:${{ github.sha }}"
          if [ -n "${{ inputs.version }}" ]; then
            tags="$tags -t ${{ env.IMAGE }}:${{ inputs.version }}"
          fi
          docker buildx imagetools create $tags \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:latest
