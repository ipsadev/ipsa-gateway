name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to release (e.g. v1.0.39); leave empty with dry_run to rehearse the branch this runs from"
        type: string
        required: false
        default: ""
      dry_run:
        description: "run the checks, but push no image and publish nothing"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    name: checks before release
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  gate:
    name: the tag must match the crate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: compare the tag with the crate version
        id: gate
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version="$(awk '/^\[package\]/ {inside = 1; next} /^\[/ {inside = 0} inside && /^version/ {gsub(/[" ]/, ""); sub(/^version=/, ""); print; exit}' Cargo.toml)"
          if [ -z "$TAG" ]; then
            if [ "$DRY_RUN" != "true" ]; then
              echo "::error::a release needs a tag; to rehearse without one, run with dry_run"
              exit 1
            fi
            TAG="v$version"
            echo "::notice::rehearsing $TAG from $GITHUB_REF_NAME, no tag needed"
          elif [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the crate version $version"
            exit 1
          else
            echo "tag $TAG matches the crate version $version"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  image:
    name: versioned gateway image
    needs: [checks, gate]
    if: ${{ inputs.dry_run != true }}
    uses: ./.github/workflows/cd.yml
    with:
      version: ${{ needs.gate.outputs.tag }}
      ref: ${{ inputs.tag || github.ref }}
    secrets: inherit

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: [gate, image]
    if: ${{ inputs.dry_run != true }}
    permissions:
      contents: write
    steps:
      - name: publish, unless it already is
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes
